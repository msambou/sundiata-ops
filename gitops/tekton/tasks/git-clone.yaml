apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: tekton-ci
spec:
  params:
    - name: url
      type: string
      description: Git repository URL to clone
    - name: revision
      type: string
      description: Git commit SHA, branch, or tag to checkout
      default: main
    - name: deleteExisting
      type: string
      description: Clean workspace before cloning
      default: "true"
  workspaces:
    - name: output
      description: Destination directory for the cloned repo
  steps:
    - name: clone
      image: alpine/git:latest
      script: |
        #!/bin/sh
        set -e
        if [ "$(params.deleteExisting)" = "true" ]; then
          rm -rf $(workspaces.output.path)/*
          rm -rf $(workspaces.output.path)/.git
        fi
        git clone $(params.url) $(workspaces.output.path)
        cd $(workspaces.output.path)
        git checkout $(params.revision)
