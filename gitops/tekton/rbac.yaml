apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-runner
  namespace: tekton-ci
---
# Allows pipeline pods to read/write within tekton-ci namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pipeline-runner
  namespace: tekton-ci
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps, persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [tasks, pipelines, pipelineruns, taskruns]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pipeline-runner
  namespace: tekton-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pipeline-runner
subjects:
  - kind: ServiceAccount
    name: pipeline-runner
    namespace: tekton-ci
---
# Allows the EventListener to create TriggerRuns in tekton-ci and watch cluster-scoped resources
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-triggers-eventlistener
rules:
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [triggers.tekton.dev]
    resources:
      - eventlisteners
      - triggerbindings
      - triggertemplates
      - triggers
      - clusterinterceptors
      - clustertriggerbindings   # cluster-scoped — must be in ClusterRole
    verbs: [get, list, watch]
  - apiGroups: [triggers.tekton.dev]
    resources: [interceptors]    # namespace-scoped but granted here via ClusterRole
    verbs: [get, list, watch]
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, pipelineresources, taskruns]
    verbs: [create]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [impersonate]
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-triggers-sa
  namespace: tekton-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-triggers-eventlistener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-triggers-eventlistener
subjects:
  - kind: ServiceAccount
    name: tekton-triggers-sa
    namespace: tekton-ci
