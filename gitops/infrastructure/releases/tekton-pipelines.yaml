apiVersion: v1
kind: Namespace
metadata:
  name: tekton-pipelines
---
# Verify latest chart version: helm search repo tektoncd/pipeline --versions
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-pipelines
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: tekton-pipelines
  storageNamespace: tekton-pipelines
  chart:
    spec:
      chart: pipeline
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: tektoncd
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values: {}
---
# Verify latest chart version: helm search repo tektoncd/triggers --versions
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tekton-triggers
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: tekton-pipelines
  storageNamespace: tekton-pipelines
  dependsOn:
    - name: tekton-pipelines
      namespace: flux-system
  chart:
    spec:
      chart: triggers
      version: ">=0.1.0-0"
      sourceRef:
        kind: HelmRepository
        name: tektoncd
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values: {}
