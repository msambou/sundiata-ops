apiVersion: v1
kind: Namespace
metadata:
  name: tekton-pipelines
---
# Tekton Pipelines — installed via official release manifest fetched from GitHub
# Check latest release: https://github.com/tektoncd/pipeline/releases
# Update ref: tag to the latest stable release before applying
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: tekton-pipelines
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/tektoncd/pipeline/release
  ref:
    tag: v0.68.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-pipelines
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: tekton-pipelines
  path: ./
  prune: false
  timeout: 5m
  wait: true
---
# Tekton Triggers — installed via official release manifest
# Check latest release: https://github.com/tektoncd/triggers/releases
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: tekton-triggers
  namespace: flux-system
spec:
  interval: 12h
  url: oci://ghcr.io/tektoncd/triggers/release
  ref:
    tag: v0.30.0
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tekton-triggers
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: tekton-triggers
  path: ./
  prune: false
  timeout: 5m
  dependsOn:
    - name: tekton-pipelines
  wait: true
