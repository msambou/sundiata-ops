replicaCount: 1

image:
  repository: cloudnativeopsacr.azurecr.io/triage-agent
  pullPolicy: Always
  tag: "latest"

nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  - name: NATS_URL
    value: "nats://nats.nats.svc.cluster.local:4222"
  - name: OLLAMA_URL
    value: "http://ollama.platform.svc.cluster.local:11434"
  - name: OTEL_SERVICE_NAME
    value: "triage-agent"

podAnnotations:
  instrumentation.opentelemetry.io/inject-python: "true"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
